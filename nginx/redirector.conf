# Перекрывает редиректор образа jonasal/nginx-certbot: в его копии есть v6-слушатель, а на этих
# хостах IPv6 выключается на уровне ЯДРА (ipv6.disable=1). Без AF_INET6 такая директива не
# деградирует — nginx не стартует вовсе. Отличие от файла образа ровно одно: убрана та строка.
server {
    listen 80 default_server reuseport;

    location '/.well-known/acme-challenge' {
        default_type "text/plain";
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$http_host$request_uri;
    }
}
