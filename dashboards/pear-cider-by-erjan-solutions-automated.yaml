kind: dashboard
key: pear-cider-by-erjan-solutions-automated
name: Pear Cider by Erjan.Solutions (automated)
description: English rebuild of the Pear Cider dashboard plus operational metrics. The Days filter drives every time-windowed card; Granularity sets the time bucket on every time-series chart.
collection: pear-cider-automated
width: full
auto_apply_filters: true
cache_ttl: null
archived: false
parameters:
- id: 821ec3b1
  name: Days
  slug: days
  sectionId: number
  type: number/=
  default:
  - 7
- id: 3f9a20c7
  name: Granularity
  slug: granularity
  sectionId: string
  type: string/=
  isMultiSelect: false
  values_query_type: list
  values_source_type: static-list
  values_source_config:
    values:
    - '1 day'
    - '12 hours'
    - '6 hours'
    - '3 hours'
    - '1 hour'
  default:
  - '1 day'
- id: 5c1d7a3e
  name: Provider
  slug: provider
  sectionId: string
  type: string/=
  isMultiSelect: false
  values_query_type: list
  values_source_type: static-list
  values_source_config:
    values:
    - Beeline
    - MTS
    - Unknown
tabs:
