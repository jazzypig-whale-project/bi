dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      SELECT count(*) AS orders_in_progress
      FROM order_
      WHERE status IN ('AWAITING_PAYMENT', 'PAID', 'WAITING_CERT', 'SENDING')
