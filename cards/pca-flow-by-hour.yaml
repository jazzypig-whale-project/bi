kind: card
key: pca-flow-by-hour
name: Flow over time — requested / produced / sent / ordered
description: Four true event streams per bucket. Idle buckets render as zero, not as a gap. Log Y-axis, since Ordered/Sent volumes are dwarfed by Requested/Produced spikes. Buckets follow the Granularity filter, Europe/Moscow.
collection: pear-cider-automated
type: question
display: line
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- Every series uses a real event timestamp; none of the four needs a proxy.
      WITH spine AS (
        SELECT generate_series(
          date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03'),
          (now() AT TIME ZONE 'Europe/Moscow'),
          {{granularity}}::text::interval) AS h),
      events AS (
        SELECT 'Requested' AS series,
               date_bin({{granularity}}::text::interval, (created_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS h
        FROM production_request
        WHERE created_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
        UNION ALL
        SELECT 'Produced',
               date_bin({{granularity}}::text::interval, (succeeded_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03')
        FROM task
        WHERE purpose = 'PRODUCTION' AND status = 'SUCCESS'
          AND succeeded_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
        UNION ALL
        SELECT 'Sent',
               date_bin({{granularity}}::text::interval, (sent_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03')
        FROM certificate
        WHERE status = 'SENT'
          AND sent_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
        UNION ALL
        SELECT 'Ordered',
               date_bin({{granularity}}::text::interval, (created_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03')
        FROM order_
        WHERE created_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')),
      series AS (SELECT unnest(ARRAY['Requested', 'Produced', 'Sent', 'Ordered']) AS series)
      SELECT s.h AS hour, sr.series, count(e.series) AS n
      FROM spine s
      CROSS JOIN series sr
      LEFT JOIN events e ON e.h = s.h AND e.series = sr.series
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: 075963f3-60d4-4b8d-b8da-22a8ab74e6ac
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: 7c2f3b5a-4e6d-4b8a-9c1f-2e3d4a5b6c7e
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - hour
  - series
  graph.metrics:
  - n
  graph.x_axis.scale: timeseries
  graph.y_axis.scale: log
  graph.y_axis.title_text: Events per bucket
  series_settings:
    Requested:
      color: '#509EE3'
    Produced:
      color: '#88BF4D'
    Sent:
      color: '#F9D45C'
    Ordered:
      color: '#7172AD'
parameters: []
