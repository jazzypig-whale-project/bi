kind: card
key: pca-production-queue-depth
name: Production queue depth
description: Production requests still waiting to be placed (status PENDING).
collection: pear-cider-automated
type: question
display: scalar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- Database 2 (legacy orchestrator). Pool and production exist only here. Demand from dealer sales
      -- reaches them through orders of the DEALER pseudo-client 00000000-0000-0000-0000-000000000002,
      -- so it is included; the dealer DB has no equivalent to twin.
      SELECT count(*) AS pending_requests
      FROM production_request
      WHERE status = 'PENDING'
visualization_settings: {}
parameters: []
