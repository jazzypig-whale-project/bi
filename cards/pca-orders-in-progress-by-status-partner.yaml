kind: card
key: pca-orders-in-progress-by-status-partner
name: Orders in progress now, by status and partner
description: Live non-terminal orders. Each of the four statuses is always shown, even at zero.
collection: pear-cider-automated
type: question
display: table
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      WITH statuses AS (
        SELECT * FROM (VALUES
          ('AWAITING_PAYMENT', 'Awaiting payment'),
          ('PAID', 'Paid'),
          ('WAITING_CERT', 'Awaiting certificate'),
          ('SENDING', 'Sending')) AS t(status, status_label)),
      partners AS (SELECT unnest(ARRAY['Sber', 'Other partners']) AS partner),
      live AS (
        SELECT o.status,
               CASE WHEN c.name = 'sber' THEN 'Sber' ELSE 'Other partners' END AS partner
        FROM order_ o
        LEFT JOIN api_client c ON c.client_id = o.client_id
        WHERE o.status IN ('AWAITING_PAYMENT', 'PAID', 'WAITING_CERT', 'SENDING'))
      SELECT st.status_label AS status, p.partner, count(l.status) AS orders
      FROM statuses st
      CROSS JOIN partners p
      LEFT JOIN live l ON l.status = st.status AND l.partner = p.partner
      GROUP BY st.status, st.status_label, p.partner
      ORDER BY CASE st.status
                 WHEN 'AWAITING_PAYMENT' THEN 1
                 WHEN 'PAID' THEN 2
                 WHEN 'WAITING_CERT' THEN 3
                 WHEN 'SENDING' THEN 4
               END, (p.partner <> 'Sber'), p.partner
visualization_settings:
  column_settings:
    '["name","status"]':
      column_title: Status
    '["name","partner"]':
      column_title: Partner
    '["name","orders"]':
      column_title: Order count
parameters: []
