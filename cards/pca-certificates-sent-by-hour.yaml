kind: card
key: pca-certificates-sent-by-hour
name: Certificates sent over time
description: Certificates sent per bucket over the Days window, stacked by face value (top 8 denominations, the rest as Other). Supersedes the by-day form of the original card. Buckets follow the Granularity filter, Europe/Moscow.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- Top 8 denominations by count over the window, individually; the rest are grouped as Other.
      WITH sent AS (
        SELECT date_bin({{granularity}}::text::interval, (sent_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS h,
               amount
        FROM certificate
        WHERE status = 'SENT'
          AND sent_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')),
      ranked AS (
        SELECT amount, row_number() OVER (ORDER BY count(*) DESC, amount) AS rn
        FROM sent
        GROUP BY amount)
      SELECT s.h AS hour,
             CASE WHEN r.rn <= 8 THEN s.amount::text ELSE 'Other' END AS denomination,
             count(*) AS certificates
      FROM sent s
      JOIN ranked r ON r.amount = s.amount
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: dbdb0727-f4bb-4aa6-9909-efd9a5d8ed5f
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: 6b1e2a4c-3f7d-4a9b-8c2e-1d5f6a7b8c9d
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - hour
  - denomination
  graph.metrics:
  - certificates
  graph.x_axis.scale: timeseries
  graph.y_axis.title_text: Certificates sent
  stackable.stack_type: stacked
parameters: []
