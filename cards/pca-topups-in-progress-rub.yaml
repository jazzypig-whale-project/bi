kind: card
key: pca-topups-in-progress-rub
name: Top-ups in progress, ₽
description: Money in flight — sum of amount over payout rows whose current status is CREATE_RETRY or PENDING_POLL, mirroring TopUpPayoutRepository.sumNonFinalAmountByNumberId. The terminal statuses COMPLETED, REFUSED, EXHAUSTED, FAILED, PARKED, SPLIT and SUPERSEDED are excluded. The unsent TOPUP_REQUEST outbox rows that TopUpInFlightService.inFlightAmount adds on top are not counted here.
collection: pear-cider-automated
type: question
display: scalar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      SELECT COALESCE(sum(amount), 0)::bigint AS topups_in_progress_rub
      FROM topup_payout
      WHERE status IN ('CREATE_RETRY', 'PENDING_POLL')
visualization_settings:
  column_settings:
    '["name","topups_in_progress_rub"]':
      suffix: ' ₽'
      decimals: 0
parameters: []
