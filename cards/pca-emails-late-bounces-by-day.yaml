kind: card
key: pca-emails-late-bounces-by-day
name: Late bounces over time
description: Late bounces per bucket over the Days window (late_bounce_at bucketed) split by resolution — Unresolved (late_bounce_resolved_at still NULL), Resent (late_bounce_resolution = resent) or Resolved manually (late_bounce_resolution = manual). Buckets follow the Granularity filter, Europe/Moscow; the rightmost bar is the still-running current bucket and is always short. Late bounces are rare — expect mostly empty buckets.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      WITH spine AS (
        SELECT generate_series(
          date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03'),
          (now() AT TIME ZONE 'Europe/Moscow'),
          {{granularity}}::text::interval) AS d),
      states AS (SELECT * FROM (VALUES ('Unresolved'), ('Resent'), ('Resolved manually')) AS t(state)),
      lb AS (
        SELECT date_bin({{granularity}}::text::interval, (late_bounce_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS d,
               CASE WHEN late_bounce_resolved_at IS NULL THEN 'Unresolved'
                    WHEN late_bounce_resolution = 'resent' THEN 'Resent'
                    ELSE 'Resolved manually' END AS state
        FROM order_
        WHERE late_bounce_at IS NOT NULL
          AND late_bounce_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC'))
      SELECT s.d AS day, st.state, count(l.state) AS late_bounces
      FROM spine s
      CROSS JOIN states st
      LEFT JOIN lb l ON l.d = s.d AND l.state = st.state
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: dd9f7c11-ed19-4ae6-bcf1-252728642eee
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: d8f9a0fc-ae2d-4fde-f27e-8d9e0f1a2b3e
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - day
  - state
  graph.metrics:
  - late_bounces
  graph.x_axis.scale: timeseries
  graph.y_axis.title_text: Late bounces
  stackable.stack_type: stacked
  series_settings:
    Unresolved:
      color: '#ED6E6E'
    Resent:
      color: '#88BF4D'
    Resolved manually:
      color: '#509EE3'
parameters: []
