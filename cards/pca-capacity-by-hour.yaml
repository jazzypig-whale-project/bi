kind: card
key: pca-capacity-by-hour
name: Quota headroom by hour (24h rotation ceiling)
description: Sums remaining quota across every account with validation_status currently GOOD that is attached to a device (up to app.registry.max-accounts-per-device = 4 per device), not only the one currently signed in. A device runs one account at a time, so this total is reachable only if devices rotate through all their accounts over 24h — it is not certificates issuable this instant. Fleet readiness and account validation_status are not historised, so this is an upper bound — today's account status and device attachment are applied retroactively to every past hour, and no device-state gate is applied at all (by design — this card carries no fleet gates). The balance series also does not subtract open RESERVED NUMBER reservations from balance_ledger.balance_after (unlike Capacity now — quota + cooldown + balance), which further inflates it relative to that scalar. Shows at most the last 14 days regardless of the Days filter. The Capacity now scalars measure a different question — certificates placeable right this instant, gated by device IDLE, agent online, validation, cooldown, holds, backoff, concurrency cap, and restricted to only the active account per device — so they read several times lower and are not the last point of this chart. Series ordering matches the scalars in both places, because adding a cap can only lower a value — Quota is at least Quota + cooldown, which is at least Quota + cooldown + balance.
collection: pear-cider-automated
type: question
display: line
cache_ttl: 300
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- Upper bound: device state, agent availability, validation status, holds and
      -- backoffs are current values only, so no historical query can apply them.
      -- Quota windows use the enforcement predicate QuotaLedgerRepository.SQL_ENFORCED_STATUSES.
      WITH limits AS (
        -- orchestrator/src/main/resources/application.yml, app.quota (lines 159-167).
        SELECT 6::bigint      AS max_tasks_per_account,   -- maxTasksPerAccount
               35000::bigint  AS day_limit_account,       -- dayLimitAccount
               500000::bigint AS day_limit_number,        -- dayLimitNumber
               600000::bigint AS month_limit_number,      -- monthLimitNumber
               1000::bigint   AS min_certificate_amount   -- minCertificateAmount
      ),
      spine AS (
        SELECT generate_series(
          date_trunc('hour', (now() AT TIME ZONE 'Europe/Moscow') - (least({{days}}, 14) * INTERVAL '1 day')),
          date_trunc('hour', (now() AT TIME ZONE 'Europe/Moscow')),
          INTERVAL '1 hour') AS h),
      subject AS (
        -- EVERY account attached to a device (app.registry.max-accounts-per-device = 4), not only
        -- the one currently signed in, with a current number and currently GOOD validation
        -- status. validation_status is not historised, so this is today's set applied to every
        -- past hour (see card description). No device-state gate: this card carries no fleet
        -- gates by design.
        SELECT acc.account_id, acc.current_number_id AS number_id
        FROM account acc
        WHERE acc.device_id IS NOT NULL
          AND acc.current_number_id IS NOT NULL
          AND acc.validation_status = 'GOOD'),
      ledger AS (
        SELECT subject_type, subject_id, amount,
               (ts AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow') AS ts
        FROM quota_ledger
        WHERE status IN ('RESERVED', 'COMMITTED')
          AND ts > (now() AT TIME ZONE 'UTC') - ({{days}} * INTERVAL '1 day') - INTERVAL '31 days'),
      -- account_window / number_window used to be a Nested Loop of every ledger row against every
      -- spine hour (rows x 169), filtered post-hoc: O(events x hours). Rewritten below as a single
      -- ordered running-sum per subject (merge real events with spine-hour checkpoints, then window
      -- SUM/COUNT with a time RANGE frame): O(events log events) per subject, exact result (no
      -- date_trunc bucketing, so no boundary-hour misclassification).
      account_timeline AS (
        SELECT subject_id, ts, amount, false AS is_checkpoint
        FROM ledger
        WHERE subject_type = 'ACCOUNT'
          AND subject_id IN (SELECT account_id FROM subject)
        UNION ALL
        SELECT sub.account_id, s.h, 0::bigint, true
        FROM spine s
        CROSS JOIN (SELECT DISTINCT account_id FROM subject) sub),
      account_running AS (
        SELECT subject_id, ts, is_checkpoint,
               count(*)    FILTER (WHERE NOT is_checkpoint) OVER w AS count24h,
               sum(amount)                                  OVER w AS money24h
        FROM account_timeline
        WINDOW w AS (PARTITION BY subject_id ORDER BY ts
                     RANGE BETWEEN INTERVAL '24 hours' PRECEDING AND CURRENT ROW)),
      account_window AS (
        SELECT ts AS h, subject_id, count24h, money24h
        FROM account_running
        WHERE is_checkpoint),
      number_timeline AS (
        SELECT subject_id, ts, amount, false AS is_checkpoint
        FROM ledger
        WHERE subject_type = 'NUMBER'
          AND subject_id IN (SELECT DISTINCT number_id FROM subject)
        UNION ALL
        SELECT sn.number_id, s.h, 0::bigint, true
        FROM spine s
        CROSS JOIN (SELECT DISTINCT number_id FROM subject) sn),
      number_running AS (
        SELECT subject_id, ts, is_checkpoint,
               sum(amount) OVER w24 AS money24h,
               sum(amount) OVER w30 AS money30d
        FROM number_timeline
        WINDOW w24 AS (PARTITION BY subject_id ORDER BY ts
                       RANGE BETWEEN INTERVAL '24 hours' PRECEDING AND CURRENT ROW),
               w30 AS (PARTITION BY subject_id ORDER BY ts
                       RANGE BETWEEN INTERVAL '30 days' PRECEDING AND CURRENT ROW)),
      number_window AS (
        SELECT ts AS h, subject_id, money24h, money30d
        FROM number_running
        WHERE is_checkpoint),
      cooldown AS (
        SELECT s.h, c.account_id
        FROM spine s
        JOIN account_cooldown c
          ON c.applied_at <= (s.h AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
         AND (c.until      IS NULL OR c.until      > (s.h AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC'))
         AND (c.cleared_at IS NULL OR c.cleared_at > (s.h AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC'))
        GROUP BY 1, 2),
      -- balance used to be a per-(hour, number) LATERAL index probe (175084 separate "last balance
      -- as of this hour" lookups). Rewritten as a single ordered forward-fill pass: merge real
      -- balance_ledger rows with spine-hour checkpoints, group rows by how many real events precede
      -- them (grp), then MAX(balance_after) per group carries the one real value in that group
      -- forward to every checkpoint until the next real event. Same result, one sort instead of
      -- 175084 index scans.
      balance_timeline AS (
        SELECT number_id, (created_at AT TIME ZONE 'Europe/Moscow') AS ts, balance_after, false AS is_checkpoint
        FROM balance_ledger
        WHERE number_id IN (SELECT DISTINCT number_id FROM subject)
        UNION ALL
        SELECT sn.number_id, s.h, NULL::bigint, true
        FROM spine s
        CROSS JOIN (SELECT DISTINCT number_id FROM subject) sn),
      balance_grouped AS (
        SELECT number_id, ts, is_checkpoint, balance_after,
               count(*) FILTER (WHERE NOT is_checkpoint)
                 OVER (PARTITION BY number_id ORDER BY ts, is_checkpoint
                       ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS grp
        FROM balance_timeline),
      balance_running AS (
        SELECT number_id, ts, is_checkpoint,
               max(balance_after) OVER (PARTITION BY number_id, grp) AS balance_after
        FROM balance_grouped),
      balance AS (
        SELECT ts AS h, number_id, balance_after
        FROM balance_running
        WHERE is_checkpoint),
      account_headroom AS (
        SELECT s.h, sub.number_id,
               CASE WHEN cd.account_id IS NOT NULL THEN 0
                    ELSE greatest(0, least(lim.max_tasks_per_account - COALESCE(aw.count24h, 0),
                                           floor((lim.day_limit_account - COALESCE(aw.money24h, 0))
                                                 / lim.min_certificate_amount)))
               END AS tasks_possible,
               -- Same admission rule, ignoring cooldown entirely (for the "Quota" series).
               greatest(0, least(lim.max_tasks_per_account - COALESCE(aw.count24h, 0),
                                 floor((lim.day_limit_account - COALESCE(aw.money24h, 0))
                                       / lim.min_certificate_amount))) AS tasks_possible_nocd
        FROM spine s
        CROSS JOIN limits lim
        CROSS JOIN subject sub
        LEFT JOIN account_window aw ON aw.h = s.h AND aw.subject_id = sub.account_id
        LEFT JOIN cooldown cd       ON cd.h = s.h AND cd.account_id = sub.account_id),
      -- Collapse to (h, number_id) BEFORE joining balance, so balance is joined 1:1 against an
      -- already-aggregated row per hour x number instead of fanning out across every account
      -- sharing that number.
      account_headroom_agg AS (
        SELECT h, number_id,
               sum(tasks_possible)      AS tasks_from_accounts,
               sum(tasks_possible_nocd) AS tasks_from_accounts_nocd
        FROM account_headroom
        GROUP BY 1, 2),
      per_number AS (
        SELECT ag.h, ag.number_id,
               ag.tasks_from_accounts,
               ag.tasks_from_accounts_nocd,
               COALESCE(b.balance_after, 0) AS balance
        FROM account_headroom_agg ag
        LEFT JOIN balance b ON b.h = ag.h AND b.number_id = ag.number_id),
      capped AS (
        SELECT pn.h, pn.number_id,
               greatest(0, least(pn.tasks_from_accounts,
                                 floor((lim.day_limit_number   - COALESCE(nw.money24h, 0)) / lim.min_certificate_amount),
                                 floor((lim.month_limit_number - COALESCE(nw.money30d, 0)) / lim.min_certificate_amount)))
                 AS quota_capacity,
               greatest(0, least(pn.tasks_from_accounts_nocd,
                                 floor((lim.day_limit_number   - COALESCE(nw.money24h, 0)) / lim.min_certificate_amount),
                                 floor((lim.month_limit_number - COALESCE(nw.money30d, 0)) / lim.min_certificate_amount)))
                 AS quota_capacity_nocd,
               greatest(0, floor(pn.balance / lim.min_certificate_amount)) AS balance_capacity
        FROM per_number pn
        CROSS JOIN limits lim
        LEFT JOIN number_window nw ON nw.h = pn.h AND nw.subject_id = pn.number_id)
      SELECT h AS hour, 'Quota (upper bound)' AS series,
             sum(quota_capacity_nocd)::bigint AS capacity
      FROM capped
      GROUP BY 1
      UNION ALL
      SELECT h, 'Quota + cooldown (upper bound)',
             sum(quota_capacity)::bigint
      FROM capped
      GROUP BY 1
      UNION ALL
      SELECT h, 'Quota + cooldown + balance (upper bound)',
             sum(least(quota_capacity, balance_capacity))::bigint
      FROM capped
      GROUP BY 1
      ORDER BY 1, 2
    template-tags:
      days:
        id: b7e3e38a-6980-41d1-867b-fdf430d0695e
        name: days
        display-name: Days
        type: number
        default: '7'
visualization_settings:
  graph.dimensions:
  - hour
  - series
  graph.metrics:
  - capacity
  graph.x_axis.scale: timeseries
  graph.y_axis.title_text: Certificates
  series_settings:
    Quota (upper bound):
      title: Quota
      color: '#88BF4D'
    Quota + cooldown (upper bound):
      title: Quota + cooldown
      color: '#509EE3'
    Quota + cooldown + balance (upper bound):
      title: Quota + cooldown + balance
      color: '#7172AD'
parameters: []
