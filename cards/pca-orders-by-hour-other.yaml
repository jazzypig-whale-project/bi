kind: card
key: pca-orders-by-hour-other
name: Orders over time — Other partners
description: Non-Sber orders bucketed by when they were created, segmented by where they ended up. Buckets follow the Granularity filter, Europe/Moscow. Volumes are much lower than Sber's; the Y-axis is scaled to this chart's own data.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- IS DISTINCT FROM, not <>: a NULL client name (missing api_client row) belongs here.
      WITH spine AS (
        SELECT generate_series(
          date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03'),
          (now() AT TIME ZONE 'Europe/Moscow'),
          {{granularity}}::text::interval) AS h),
      o AS (
        SELECT date_bin({{granularity}}::text::interval, (o.created_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS h,
               CASE
                 WHEN o.status = 'COMPLETED' THEN 'Completed'
                 WHEN o.status IN ('REJECTED', 'EXPIRED', 'FAILED_MANUAL') THEN 'Failed'
                 ELSE 'In progress'
               END AS outcome
        FROM order_ o
        LEFT JOIN api_client c ON c.client_id = o.client_id
        WHERE o.created_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
          AND c.name IS DISTINCT FROM 'sber'),
      outcomes AS (SELECT unnest(ARRAY['Completed', 'In progress', 'Failed']) AS outcome)
      SELECT s.h AS hour, x.outcome, count(o.h) AS orders
      FROM spine s
      CROSS JOIN outcomes x
      LEFT JOIN o ON o.h = s.h AND o.outcome = x.outcome
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: 6a2a8221-e790-4eef-aa8d-2c70378caa72
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: 9e4b5d7c-6a8f-4dab-be3a-4f5e6c7d8e9a
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - hour
  - outcome
  graph.metrics:
  - orders
  graph.x_axis.scale: timeseries
  graph.y_axis.title_text: Orders
  stackable.stack_type: stacked
  series_settings:
    Completed:
      color: '#88BF4D'
    Failed:
      color: '#E75454'
    In progress:
      color: '#949AAB'
parameters: []
