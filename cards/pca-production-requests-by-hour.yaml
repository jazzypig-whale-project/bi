kind: card
key: pca-production-requests-by-hour
name: Production requests over time, by outcome
description: Requests bucketed by when they were created, segmented by their current status. production_request has no terminal timestamp, so this is a cohort view. Failed requests are normally a sub-1% share, so the Failed series being invisible at this scale does not mean data is missing. Buckets follow the Granularity filter, Europe/Moscow.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- ProductionRequestStatus: PENDING, PLACING, PRODUCING, AWAITING_INTAKE, CLOSED, FAILED.
      WITH spine AS (
        SELECT generate_series(
          date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03'),
          (now() AT TIME ZONE 'Europe/Moscow'),
          {{granularity}}::text::interval) AS h),
      pr AS (
        SELECT date_bin({{granularity}}::text::interval, (created_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS h,
               CASE
                 WHEN status = 'CLOSED' THEN 'Closed'
                 WHEN status = 'FAILED' THEN 'Failed'
                 ELSE 'In progress'
               END AS outcome
        FROM production_request
        WHERE created_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')),
      outcomes AS (SELECT unnest(ARRAY['Closed', 'In progress', 'Failed']) AS outcome)
      SELECT s.h AS hour, x.outcome, count(pr.h) AS requests
      FROM spine s
      CROSS JOIN outcomes x
      LEFT JOIN pr ON pr.h = s.h AND pr.outcome = x.outcome
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: 99df7d5d-3788-4c0e-a410-c76641027be5
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: c7e8f0fb-9d1c-4ede-e16d-7c8d9e0f1a2d
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - hour
  - outcome
  graph.metrics:
  - requests
  graph.x_axis.scale: timeseries
  graph.y_axis.title_text: Requests
  stackable.stack_type: stacked
  series_settings:
    Closed:
      color: '#88BF4D'
    Failed:
      color: '#E75454'
    In progress:
      color: '#949AAB'
parameters: []
