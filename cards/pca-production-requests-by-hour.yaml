kind: card
key: pca-production-requests-by-hour
name: Production requests by hour, by outcome
description: Requests bucketed by the hour they were created, segmented by their current status. production_request has no terminal timestamp, so this is a cohort view. Failed requests are normally a sub-1% share, so the Failed series being invisible at this scale does not mean data is missing. Hour buckets are Europe/Moscow.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- ProductionRequestStatus: PENDING, PLACING, PRODUCING, AWAITING_INTAKE, CLOSED, FAILED.
      WITH spine AS (
        SELECT generate_series(
          date_trunc('hour', (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day')),
          date_trunc('hour', (now() AT TIME ZONE 'Europe/Moscow')),
          INTERVAL '1 hour') AS h),
      pr AS (
        SELECT date_trunc('hour', (created_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow')) AS h,
               CASE
                 WHEN status = 'CLOSED' THEN 'Closed'
                 WHEN status = 'FAILED' THEN 'Failed'
                 ELSE 'In progress'
               END AS outcome
        FROM production_request
        WHERE created_at >= (now() AT TIME ZONE 'UTC') - ({{days}} * INTERVAL '1 day')),
      outcomes AS (SELECT unnest(ARRAY['Closed', 'In progress', 'Failed']) AS outcome)
      SELECT s.h AS hour, x.outcome, count(pr.h) AS requests
      FROM spine s
      CROSS JOIN outcomes x
      LEFT JOIN pr ON pr.h = s.h AND pr.outcome = x.outcome
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: 99df7d5d-3788-4c0e-a410-c76641027be5
        name: days
        display-name: Days
        type: number
        default: '7'
visualization_settings:
  graph.dimensions:
  - hour
  - outcome
  graph.metrics:
  - requests
  graph.x_axis.scale: timeseries
  graph.y_axis.title_text: Requests
  stackable.stack_type: stacked
  series_settings:
    Closed:
      color: '#88BF4D'
    Failed:
      color: '#E75454'
    In progress:
      color: '#949AAB'
parameters: []
