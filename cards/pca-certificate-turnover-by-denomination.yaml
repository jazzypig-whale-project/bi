kind: card
key: pca-certificate-turnover-by-denomination
name: Certificate face value sent by denomination, ₽
description: Sum of certificate.amount per face value over certificates already SENT, over the dashboard's Days filter window. It measures delivered certificates, including those issued for bulk orders that have no order_ row, so it is not a subset of Order value by partner and the two totals must not be compared or reconciled.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      SELECT amount AS denomination, sum(amount)::bigint AS turnover
      FROM certificate
      WHERE status = 'SENT'
        AND sent_at >= (now() AT TIME ZONE 'UTC') - ({{days}} * INTERVAL '1 day')
      GROUP BY 1
      ORDER BY 1
    template-tags:
      days:
        id: 9ef89d3f-eaba-47b5-bd6c-c8fd5969201c
        name: days
        display-name: Days
        type: number
        default: '7'
visualization_settings:
  graph.dimensions:
  - denomination
  graph.metrics:
  - turnover
  graph.x_axis.scale: ordinal
  graph.show_values: false
  series_settings:
    turnover:
      color: '#509EE3'
  column_settings:
    '["name","turnover"]':
      suffix: ' ₽'
      decimals: 0
parameters: []
