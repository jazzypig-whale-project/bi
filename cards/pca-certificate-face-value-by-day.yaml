kind: card
key: pca-certificate-face-value-by-day
name: Certificate face value over time, ₽
description: Sum of SENT certificate face values per bucket, Europe/Moscow. Complete buckets are drawn in the default color; the still-running current bucket is a separate series in a different color, since it never covers a full bucket. The dashed line is Metabase's linear trend fitted over the complete buckets only. Buckets follow the Granularity filter.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- Buckets follow the Granularity filter, Europe/Moscow; certificate.sent_at is naive UTC.
      -- Complete buckets go in face_value, the still-running current bucket goes in
      -- face_value_today (separate column = separate, differently-colored series),
      -- so the trend line (fit on face_value only) never reads a partial bucket as movement.
      WITH current_bucket AS (
        SELECT date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS day
      ),
      daily AS (
        SELECT date_bin({{granularity}}::text::interval, (c.sent_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS day,
               sum(c.amount)::bigint                                                          AS face_value
        FROM certificate c
        WHERE c.status = 'SENT'
          AND c.sent_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
          AND c.sent_at <  (now() AT TIME ZONE 'UTC')
        GROUP BY 1
      )
      SELECT d.day,
             CASE WHEN d.day <  t.day THEN d.face_value END AS face_value,
             CASE WHEN d.day =  t.day THEN d.face_value END AS face_value_today
      FROM daily d, current_bucket t
      ORDER BY d.day
    template-tags:
      days:
        id: 8f323b82-b255-4847-829a-3cbe13a6e4e9
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: 5af6b7ff-b395-4fb5-fafd-a5f6a7b8c9f5
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - day
  graph.metrics:
  - face_value
  - face_value_today
  graph.x_axis.scale: timeseries
  graph.y_axis.auto_split: false
  graph.show_values: true
  graph.show_trendline: true
  graph.y_axis.title_text: Certificate face value, ₽
  column_settings:
    '["name","face_value"]':
      suffix: ' ₽'
      decimals: 1
    '["name","face_value_today"]':
      suffix: ' ₽'
      decimals: 1
  series_settings:
    face_value:
      title: Complete buckets
      color: '#509EE3'
    face_value_today:
      title: Current bucket
      color: '#84BB4C'
parameters: []
