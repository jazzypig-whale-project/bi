kind: card
key: pca-certificate-face-value-by-day
name: Certificate face value by day, ₽
description: Sum of SENT certificate face values per Europe/Moscow day, stacked by the phone provider whose number funded
  the certificate (certificate → production_request → the succeeded task's number → provider). Certificates sent before production_request_id
  was recorded (2026-08-26) have no traceable provider and fall into "Unknown".
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: "-- Days are Europe/Moscow days; certificate.sent_at is naive UTC.\n-- Provider comes from the succeeded task\
      \ that consumed the certificate's production\n-- request; a production request can have more than one succeeded task\
      \ (retried\n-- placements), so the LATERAL picks the latest one instead of joining plainly and\n-- double-counting the\
      \ certificate's face value. No traceable task -> Unknown.\nWITH cert AS (\n  SELECT date_trunc('day', (c.sent_at AT\
      \ TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow')) AS day,\n         c.amount,\n         COALESCE(phone_provider.name,\
      \ 'Unknown') AS provider\n  FROM certificate c\n  LEFT JOIN LATERAL (\n    SELECT t.number_id\n    FROM task t\n   \
      \ WHERE t.production_request_id = c.production_request_id\n      AND t.succeeded_at IS NOT NULL\n    ORDER BY t.succeeded_at\
      \ DESC\n    LIMIT 1\n  ) won ON true\n  LEFT JOIN number         ON number.number_id = won.number_id\n  LEFT JOIN phone_provider\
      \ ON phone_provider.code = number.provider_code\n  WHERE c.status = 'SENT'\n    AND c.sent_at >= ((date_trunc('day',\
      \ (now() AT TIME ZONE 'Europe/Moscow')) - ({{days}} * INTERVAL '1 day')) AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')\n\
      \    AND c.sent_at <  (now() AT TIME ZONE 'UTC')\n    AND {{provider}}\n)\nSELECT day, provider, sum(amount)::bigint\
      \ AS face_value\nFROM cert\nGROUP BY day, provider\nORDER BY day, provider\n"
    template-tags:
      days:
        display-name: Days
        type: number
        id: 8f323b82-b255-4847-829a-3cbe13a6e4e9
        name: days
        default: '7'
      provider:
        dimension:
        - field
        - {}
        - 472
        widget-type: string/=
        id: f1527f1f-0950-4014-8641-c6b71c11110f
        name: provider
        display-name: Provider
        type: dimension
        default: null
visualization_settings:
  graph.y_axis.title_text: Certificate face value, ₽
  graph.show_values: false
  graph.y_axis.auto_split: false
  graph.metrics:
  - face_value
  column_settings:
    '["name","face_value"]':
      suffix: ' ₽'
      decimals: 1
  series_settings:
    Beeline:
      color: '#509EE3'
    MTS:
      color: '#88BF4D'
    Unknown:
      color: '#A989C5'
  graph.x_axis.scale: timeseries
  graph.dimensions:
  - day
  - provider
  stackable.stack_type: stacked
parameters: []
