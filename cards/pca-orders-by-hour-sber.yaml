kind: card
key: pca-orders-by-hour-sber
name: Orders over time — Sber
description: Sber orders bucketed by when they were created, segmented by where they ended up. Buckets follow the Granularity filter, Europe/Moscow. Bulk orders (which have no order_ row) appear as one extra series per client, "Bulk — <client>", bucketed by creation time and valued in certificates rather than orders; cancelled bulks are excluded.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- Cohort view on created_at: failed orders carry no terminal timestamp, so a
      -- cohort chart is the only one that invents nothing.
      WITH spine AS (
        SELECT generate_series(
          date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03'),
          (now() AT TIME ZONE 'Europe/Moscow'),
          {{granularity}}::text::interval) AS h),
      o AS (
        SELECT date_bin({{granularity}}::text::interval, (o.created_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS h,
               1 AS n,
               CASE
                 WHEN o.status = 'COMPLETED' THEN 'Completed'
                 WHEN o.status IN ('REJECTED', 'EXPIRED', 'FAILED_MANUAL') THEN 'Failed'
                 ELSE 'In progress'
               END AS outcome
        FROM order_ o
        LEFT JOIN api_client c ON c.client_id = o.client_id
        WHERE o.created_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
          AND c.name = 'sber'
        UNION ALL
        -- Bulk orders have no order_ row, so they are a separate series per client, valued in
        -- certificates (sum of line quantities) — not comparable with the order counts above.
        -- created_at is timestamptz, hence no UTC step. Cancelled bulks are left out.
        SELECT date_bin({{granularity}}::text::interval, (b.created_at AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS h,
               l.qty AS n,
               'Bulk — ' || COALESCE(NULLIF(c.name, ''), NULLIF(b.client_name, ''), 'unknown') AS outcome
        FROM bulk_order b
        JOIN (SELECT bulk_order_id, sum(quantity) AS qty FROM bulk_order_line GROUP BY 1) l ON l.bulk_order_id = b.bulk_order_id
        LEFT JOIN api_client c ON c.client_id = b.client_id
        WHERE b.cancelled_at IS NULL
          AND b.created_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow')
          AND c.name = 'sber'),
      outcomes AS (
        SELECT unnest(ARRAY['Completed', 'In progress', 'Failed']) AS outcome
        UNION
        SELECT DISTINCT outcome FROM o WHERE outcome LIKE 'Bulk — %')
      SELECT s.h AS hour, x.outcome, COALESCE(sum(o.n), 0) AS orders
      FROM spine s
      CROSS JOIN outcomes x
      LEFT JOIN o ON o.h = s.h AND o.outcome = x.outcome
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: 822e0d63-f30e-44f9-b402-9a22f6d05e4c
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: 8d3a4c6b-5f7e-4c9b-ad2f-3e4d5b6c7d8f
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - hour
  - outcome
  graph.metrics:
  - orders
  graph.x_axis.scale: timeseries
  graph.y_axis.title_text: Orders (bulk in certificates)
  stackable.stack_type: stacked
  series_settings:
    Completed:
      color: '#88BF4D'
    Failed:
      color: '#E75454'
    In progress:
      color: '#949AAB'
parameters: []
