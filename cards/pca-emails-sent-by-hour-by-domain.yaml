kind: card
key: pca-emails-sent-by-hour-by-domain
name: Emails sent over time, by sender domain
description: Emails sent per bucket over the Days window, split by the domain of the From address. Domains come from the data, so new sender domains appear automatically. Buckets follow the Granularity filter, Europe/Moscow.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      WITH spine AS (
        SELECT generate_series(
          date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03'),
          (now() AT TIME ZONE 'Europe/Moscow'),
          {{granularity}}::text::interval) AS h),
      mail AS (
        SELECT date_bin({{granularity}}::text::interval, (sent_confirmed_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS h,
               lower(split_part(sent_from_address, '@', 2)) AS domain
        FROM order_
        WHERE sent_confirmed_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
          AND sent_from_address IS NOT NULL),
      domains AS (SELECT DISTINCT domain FROM mail)
      SELECT s.h AS hour, d.domain, count(m.domain) AS emails
      FROM spine s
      CROSS JOIN domains d
      LEFT JOIN mail m ON m.h = s.h AND m.domain = d.domain
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: 32dcf0b2-1462-4ecb-a417-a09f4e15b103
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: a5c6e8d9-7b9a-4ebc-cf4b-5a6b7c8d9e0b
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - hour
  - domain
  graph.metrics:
  - emails
  graph.x_axis.scale: timeseries
  graph.y_axis.title_text: Emails sent
  stackable.stack_type: stacked
  series_settings:
    apple-gift.org:
      color: '#509EE3'
    engine.smartfruit.org:
      color: '#88BF4D'
parameters: []
