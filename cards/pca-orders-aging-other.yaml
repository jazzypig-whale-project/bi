kind: card
key: pca-orders-aging-other
name: Orders aging — Other partners
description: How old the open non-Sber orders were at each whole hour. REJECTED/EXPIRED/FAILED_MANUAL orders are excluded — they carry no end timestamp. EXPIRED_TTL orders have their end reconstructed as created_at + client_billing.order_ttl_minutes, the exact deadline the TTL sweep writes them off at. The backlog is sampled once per hour, so an order that opens and closes between two hour marks never appears; non-Sber orders currently complete within seconds, so an empty chart is the expected result and means no non-Sber order was open at an hour mark, not a broken query.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- Open interval is [created_at, ended_at), left open while ended_at is null.
      -- COMPLETED orders always carry completed_at and the interval is exact for them.
      -- EXPIRED_TTL orders carry no end timestamp (see order/OrderRepository.java
      -- expireTtlFromQueued/expireTtlFromSending), so ended_at is reconstructed as
      -- created_at + client_billing.order_ttl_minutes -- the exact deadline the TTL sweep
      -- (findExpiredByClientTtl) selects on. Accurate to the ~30s sweep tick; skewed if a
      -- partner's TTL was edited after the write-off.
      WITH spine AS (
        SELECT generate_series(
          date_trunc('hour', (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day')),
          date_trunc('hour', (now() AT TIME ZONE 'Europe/Moscow')),
          INTERVAL '1 hour') AS h),
      o AS (
        SELECT (o.created_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow') AS created_at,
               (COALESCE(
                  o.completed_at,
                  CASE WHEN o.status = 'EXPIRED_TTL'
                       THEN o.created_at + make_interval(mins => COALESCE(b.order_ttl_minutes, 0))
                  END) AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow') AS ended_at
        FROM order_ o
        LEFT JOIN api_client c ON c.client_id = o.client_id
        LEFT JOIN client_billing b ON b.client_id = o.client_id
        WHERE o.status NOT IN ('REJECTED', 'EXPIRED', 'FAILED_MANUAL')
          AND c.name IS DISTINCT FROM 'sber'
          AND (o.completed_at IS NULL OR o.completed_at >= date_trunc('hour', (now() AT TIME ZONE 'UTC') - ({{days}} * INTERVAL '1 day'))))
      SELECT s.h AS hour,
             CASE
               WHEN s.h - o.created_at < INTERVAL '1 minute'   THEN '01 <1m'
               WHEN s.h - o.created_at < INTERVAL '5 minutes'  THEN '02 1-5m'
               WHEN s.h - o.created_at < INTERVAL '15 minutes' THEN '03 5-15m'
               WHEN s.h - o.created_at < INTERVAL '30 minutes' THEN '04 15-30m'
               WHEN s.h - o.created_at < INTERVAL '1 hour'     THEN '05 30m-1h'
               WHEN s.h - o.created_at < INTERVAL '3 hours'    THEN '06 1-3h'
               WHEN s.h - o.created_at < INTERVAL '6 hours'    THEN '07 3-6h'
               WHEN s.h - o.created_at < INTERVAL '1 day'      THEN '08 6h-1d'
               WHEN s.h - o.created_at < INTERVAL '3 days'     THEN '09 1-3d'
               ELSE '10 >3d'
             END AS age_bucket,
             count(*) AS n
      FROM spine s
      JOIN o ON o.created_at <= s.h AND (o.ended_at IS NULL OR o.ended_at > s.h)
      GROUP BY 1, 2
      ORDER BY 1, 2
    template-tags:
      days:
        id: bf00ff67-a05f-4aaf-8ccc-160c6cceef31
        name: days
        display-name: Days
        type: number
        default: '7'
