kind: card
key: pca-average-check-by-day
name: Average check over time, ₽
description: Mean face value (₽) of the certificates sent per bucket, over the Days window. Buckets follow the Granularity filter, Europe/Moscow.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      SELECT date_bin({{granularity}}::text::interval, (sent_at AT TIME ZONE 'UTC' AT TIME ZONE 'Europe/Moscow'), TIMESTAMP '2000-01-03') AS day,
             round(avg(amount), 0)::bigint                                                AS average_check
      FROM certificate
      WHERE status = 'SENT'
        AND sent_at >= (date_bin({{granularity}}::text::interval, (now() AT TIME ZONE 'Europe/Moscow') - ({{days}} * INTERVAL '1 day'), TIMESTAMP '2000-01-03') AT TIME ZONE 'Europe/Moscow' AT TIME ZONE 'UTC')
      GROUP BY 1
      ORDER BY 1
    template-tags:
      days:
        id: 4b343176-a566-4071-80d2-21ceb298e6b5
        name: days
        display-name: Days
        type: number
        default: '7'
      granularity:
        id: 4fe5a6fe-a284-4fa4-e9e4-f4e5f6a7b8e4
        name: granularity
        display-name: Granularity
        type: text
        default: '1 day'
visualization_settings:
  graph.dimensions:
  - day
  graph.metrics:
  - average_check
  graph.x_axis.scale: timeseries
  graph.show_values: false
  graph.y_axis.title_text: Average check, ₽
  column_settings:
    '["name","average_check"]':
      suffix: ' ₽'
      decimals: 0
  series_settings:
    average_check:
      color: '#509EE3'
parameters: []
