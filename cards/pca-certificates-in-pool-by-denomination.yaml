kind: card
key: pca-certificates-in-pool-by-denomination
name: Certificates in pool by denomination
description: Free certificates available per face value, sorted highest count first. The 8 largest denominations are shown individually; the rest are grouped as Other. Merges the two original pool-by-denomination cards.
collection: pear-cider-automated
type: question
display: bar
cache_ttl: null
archived: false
dataset_query:
  lib/type: mbql/query
  database: 2
  stages:
  - lib/type: mbql.stage/native
    native: |
      -- Top 8 denominations by count, individually; the rest are grouped as Other.
      WITH by_denom AS (
        SELECT amount, count(*) AS certificates
        FROM certificate
        WHERE status = 'FREE'
        GROUP BY 1),
      ranked AS (
        SELECT amount, certificates,
               row_number() OVER (ORDER BY certificates DESC, amount) AS rn
        FROM by_denom),
      bucketed AS (
        SELECT CASE WHEN rn <= 8 THEN amount::text ELSE 'Other' END AS denomination,
               certificates
        FROM ranked)
      SELECT denomination, sum(certificates) AS certificates
      FROM bucketed
      GROUP BY 1
      ORDER BY (denomination = 'Other'), 2 DESC, 1
visualization_settings:
  graph.dimensions:
  - denomination
  graph.metrics:
  - certificates
  graph.x_axis.scale: ordinal
  graph.show_values: false
  series_settings:
    certificates:
      color: '#509EE3'
parameters: []
